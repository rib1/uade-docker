[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3

[tool.ruff]
line-length = 100
target-version = "py313"
preview = true

[tool.ruff.format]
preview = false

[tool.ruff.lint]
explicit-preview-rules = true
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "S",   # flake8-bandit (security)
    "A",   # flake8-builtins
    "ARG", # flake8-unused-arguments
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "FBT", # flake8-boolean-trap
    "LOG", # flake8-logging
    "PYI", # flake8-pyi
    "Q",   # flake8-quotes
    "PERF", # Perflint
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "SLF", # flake8-self
    "TC",  # flake8-type-checking
    "TID", # flake8-tidy-imports
    "RET", # flake8-return
    "RUF", # Ruff-specific rules
    "PTH", # pathlib best practices
    "PLE", # pylint errors
    "PLW", # pylint warnings
    "D421", # property-docstring-starts-with-verb
    "PLR2004", # magic-value-comparison
    "LOG004", # logging.exception outside exception handlers
    "PLW0717", # too-many-statements-in-try-clause
    "RUF050", # unnecessary-if
    "RUF072", # useless-finally
    "RUF073", # f-string-percent-format
    "RUF074", # incorrect-decorator-order
    "RUF075", # fallible-context-manager
]
ignore = [
    "S101", # Ignore `assert` statements, which are used in test scripts
    "S104", # Ignore `bind_all_interfaces` for the local dev server
]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.pylint]
max-statements-in-try = 50

[tool.pylint]
max-line-length = 100

[tool.mypy]
python_version = "3.13"
local_partial_types = true
files = ["web/server.py"]
follow_imports = "silent"
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
strict_equality_for_none = true
warn_unreachable = true
warn_redundant_casts = true
warn_no_return = true
disallow_any_generics = true
no_implicit_reexport = true
strict_bytes = true
extra_checks = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_unimported = true
warn_unused_ignores = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "exhaustive-match",
]
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "fsspec",
    "flask",
    "flask_limiter",
    "flask_limiter.util",
    "werkzeug.utils",
]
ignore_missing_imports = true

[tool.vulture]
exclude = ["build/", "dist/", ".venv/", "__pycache__/"]
ignore_decorators = [
    "@app.route",
    "@app.errorhandler",
    "@app.after_request",
    "@app.before_request",
    "@limiter.exempt",
    "@limiter.limit",
    "@contextmanager",
]
min_confidence = 100
paths = ["web", "test/report_endpoint_coverage.py", "test/zap_seed_targets.py"]
sort_by_size = true

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"
