# Build and run the run web player:
#    powershell:
#    $env:GIT_COMMIT = (git rev-parse HEAD); docker compose -f docker-compose.yml up -d --build uade-web
#    or in bash:
#    GIT_COMMIT=$(git rev-parse HEAD); docker compose -f docker-compose.yml up -d --build uade-web
# Development mode with hot reload (HTML/JS/CSS via refresh, Python via Flask reloader):
#    docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build uade-web
#    This keeps the base compose file production-like and enables reload only through docker-compose.dev.yml.
# To stop and remove all containers:
#    docker compose down -v
# To validate code quality:
#     docker compose -f docker-compose.yml -f test/docker-compose.quality.yml run --rm --build quality-check
# To run integration tests:
# 1. Build and run the test runner service (this sets UADE_TEST_MODE=1 for uade-web):
#    powershell:
#    $env:GIT_COMMIT = (git rev-parse HEAD); docker compose -f docker-compose.yml -f test/docker-compose.endpoints.yml run --rm --build uade-test-runner
#    or in bash:
#    GIT_COMMIT=$(git rev-parse HEAD); docker compose -f docker-compose.yml -f test/docker-compose.endpoints.yml run --rm --build uade-test-runner
# 2. To run integration tests again:
#    docker compose -f docker-compose.yml -f test/docker-compose.endpoints.yml run --rm uade-test-runner
# 3. To verify /test endpoints stay unavailable in prod mode:
#    docker compose -f docker-compose.yml -f test/docker-compose.prodmode.yml up --force-recreate --build --abort-on-container-exit --exit-code-from uade-test-prod-mode-runner uade-web uade-test-prod-mode-runner
# 4. To run ratelimit-tests (RATE_LIMIT_DISABLED set ON by docker-compose.ratelimit.yml):
#    docker compose -f docker-compose.yml -f test/docker-compose.ratelimit.yml run --rm --build uade-test-ratelimit-runner
# 5. To run the accessibility test:
#    docker compose -f docker-compose.yml -f test/docker-compose.accessibility.yml run --rm --build uade-test-accessibility-runner
# 6. To run the race condition test:
#    docker compose run --rm --build uade-test-race-condition-runner
# 7. To bring up the multi-instance UI locally (two app containers sharing cache):
#    docker compose -f docker-compose.yml -f test/docker-compose.multiinstance.yml up -d --build uade-web-a uade-web-b
#    UI URLs:
#      http://localhost:5001  (uade-web-a)
#      http://localhost:5002  (uade-web-b)
#    To run the multi-instance tests:
#    docker compose -f docker-compose.yml -f test/docker-compose.multiinstance.yml run --rm --build uade-test-multiinstance-runner
#    To stop and clean up the multi-instance setup:
#    docker compose -f docker-compose.yml -f test/docker-compose.multiinstance.yml down -v
# 8. To run the benchmark suite (rate limiting disabled, uses the same downloaded fixtures as the endpoint tests):
#    powershell:
#    $env:GIT_COMMIT = (git rev-parse HEAD); docker compose -f docker-compose.yml -f test/docker-compose.benchmark.yml run --rm --build uade-benchmark-runner
#    or in bash:
#    GIT_COMMIT=$(git rev-parse HEAD) docker compose -f docker-compose.yml -f test/docker-compose.benchmark.yml run --rm --build uade-benchmark-runner
# 9. To run a DAST scan (UADE_TEST_MODE is OFF by default):
#    docker compose run --rm --build zap-scan
#    To run a DAST scan with local-only ZAP seed requests (UADE_TEST_MODE is ON):
#    docker compose run --rm --build zap-scan-seeded
#    The HTML report will be in the ./reports directory.
# 10. To run a full DAST scan (UADE_TEST_MODE is OFF by default):
#    docker compose run --rm --build zap-full-scan
#    To run a full DAST scan with local-only ZAP seed requests (UADE_TEST_MODE is ON):
#    docker compose run --rm --build zap-full-scan-seeded
#    The HTML report will be in the ./reports directory.

services:
  uade-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
    container_name: uade-web-player
    ports:
      - "5000:5000"
    volumes:
      # Persistent temp storage for uploads/conversions
      - uade-tmp:/tmp
    environment:
      - FLASK_ENV=production
      - MAX_UPLOAD_SIZE=10485760  # 10MB in bytes
      - CLEANUP_INTERVAL=3600      # 1 hour in seconds
      - RATE_LIMIT_DISABLED=1  # disable rate limiting for local testing
      - DISABLE_SSL_VERIFY=1  # disable SSL verification for corporate proxies (Zscaler)
      - UADE_TEST_MODE=${UADE_TEST_MODE:-0}  # enable local fixture host only when explicitly requested
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - uade-net

  uade-web-seeded:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
    container_name: uade-web-player-seeded
    volumes:
      - uade-tmp:/tmp
    environment:
      - FLASK_ENV=production
      - MAX_UPLOAD_SIZE=10485760  # 10MB in bytes
      - CLEANUP_INTERVAL=3600      # 1 hour in seconds
      - RATE_LIMIT_DISABLED=1  # disable rate limiting for local testing
      - DISABLE_SSL_VERIFY=1  # disable SSL verification for corporate proxies (Zscaler)
      - UADE_TEST_MODE=1  # enable local fixture host for seeded scans
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - uade-net

  uade-test-runner:
    build:
      context: .
      dockerfile: test/Dockerfile.test
    depends_on:
      uade-web:
        condition: service_healthy
      test-http-server: # Add dependency on the new test HTTP server
        condition: service_healthy
    volumes:
      - test-tmp:/home/tester/app/fixtures
      - uade-tmp:/uade-tmp
    networks:
      - uade-net

  test-fixture-preparer:
    build:
      context: .
      dockerfile: test/Dockerfile.test
    command: ["./prepare-endpoint-fixtures.sh"]
    volumes:
      - test-tmp:/home/tester/app/fixtures
    networks:
      - uade-net

  test-http-server: # Service for serving test files
    image: python:3.13-alpine # A lightweight Python image
    container_name: uade-test-http-server
    command: python -m http.server 8000 # Serve on port 8000
    depends_on:
      test-fixture-preparer:
        condition: service_completed_successfully
    volumes:
      - test-tmp:/app/fixtures # Mount test fixtures
    working_dir: /app # Serve from /app
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 8000), 2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - uade-net

  zap-scan:
    image: ghcr.io/zaproxy/zaproxy:stable
    # DAST scanner service using OWASP ZAP.
    # It scans the uade-web service.
    command: zap-baseline.py -t http://uade-web:5000 -j -a -r report.html -w report.md
    depends_on:
      uade-web:
        condition: service_healthy
    volumes:
      # ZAP reports will be saved in the 'reports' directory on the host
      - ./reports:/zap/wrk
    networks:
      - uade-net

  zap-full-scan:
    extends:
      service: zap-scan
    command: zap-full-scan.py -t http://uade-web:5000 -j -a -r report.html -w report.md

  zap-scan-seeded:
    extends:
      service: zap-scan
    command: >-
      sh -lc "python /zap/wrk/zap_seed_targets.py &&
      python /zap/zap-baseline.py -t http://uade-web-player-seeded:5000 -j -a -r report.html -w report.md"
    depends_on:
      uade-web-seeded:
        condition: service_healthy
      test-http-server:
        condition: service_healthy
    environment:
      - ZAP_TARGET_URL=http://uade-web-player-seeded:5000
    volumes:
      - ./reports:/zap/wrk
      - ./test/zap_seed_targets.py:/zap/wrk/zap_seed_targets.py:ro
      - test-tmp:/zap/fixtures

  zap-full-scan-seeded:
    extends:
      service: zap-scan-seeded
    command: >-
      sh -lc "python /zap/wrk/zap_seed_targets.py &&
      python /zap/zap-full-scan.py -t http://uade-web-player-seeded:5000 -j -a -r report.html -w report.md"

  uade-test-race-condition-runner:
    build:
      context: .
      dockerfile: test/Dockerfile.test
    depends_on:
      uade-web-seeded:
        condition: service_healthy
      test-http-server:
        condition: service_healthy
    command: ["./test_race_condition.sh"]
    environment:
      - BASE_URL=http://uade-web-player-seeded:5000
      - URL_TO_TEST=http://uade-test-http-server:8000/fixtures/modules/space_debris.mod
    networks:
      - uade-net

volumes:
  uade-tmp:
    driver: local
  test-tmp:
    driver: local

networks:
  uade-net:
    driver: bridge
