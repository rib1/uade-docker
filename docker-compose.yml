# To run tests:
# 1. Build and run the test runner service:
#    docker-compose up --build uade-test-runner
# 2. To run tests again:
#    docker-compose run --rm uade-test-runner

services:
  uade-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
    container_name: uade-web-player
    ports:
      - "5000:5000"
    volumes:
      # Mount source code (read-only for security)
      - ./web:/app:ro
      # Persistent temp storage for uploads/conversions
      - uade-tmp:/tmp
    environment:
      - FLASK_ENV=production
      - MAX_UPLOAD_SIZE=10485760  # 10MB in bytes
      - CLEANUP_INTERVAL=3600      # 1 hour in seconds
      - RATE_LIMIT=10              # Max conversions per minute per IP
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - uade-net

  uade-test-runner:
    build:
      context: .
      dockerfile: test/Dockerfile.test
    depends_on:
      uade-web:
        condition: service_healthy
    networks:
      - uade-net

volumes:
  uade-tmp:
    driver: local

networks:
  uade-net:
    driver: bridge
