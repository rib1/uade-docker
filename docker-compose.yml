# Build and run the run web player:
#    powershell:
#    $env:GIT_COMMIT = (git rev-parse HEAD); docker-compose up -d --build uade-web
#    or in bash:
#    GIT_COMMIT=$(git rev-parse HEAD); docker-compose up --build  uade-web
# To run tests:
# 1. Build and run the test runner service:
#    powershell:
#    $env:GIT_COMMIT = (git rev-parse HEAD); docker-compose up --build  uade-test-runner
#    or in bash:
#    GIT_COMMIT=$(git rev-parse HEAD); docker-compose up --build  uade-test-runner
# 2. To run tests again:
#    docker-compose run --rm uade-test-runner
# 3. To run ratelimit-tests:
#    docker-compose -f docker-compose.yml -f test/docker-compose.ratelimit.yml up --build uade-test-ratelimit-runner
# 4. To run the race condition test:
#    docker-compose up --build uade-test-race-condition-runner
# 5. To run a DAST scan:
#    docker-compose up --build zap-scan
#    The HTML report will be in the ./reports directory.
# 6. To run a full DAST scan:
#    docker-compose up --build zap-full-scan
#    The HTML report will be in the ./reports directory.
# 7. To stop and remove all containers:
#    docker compose down -v

services:
  uade-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
    container_name: uade-web-player
    ports:
      - "5000:5000"
    volumes:
      # Mount source code (read-only for security)
      - ./web:/app:ro
      # Persistent temp storage for uploads/conversions
      - uade-tmp:/tmp
    environment:
      - FLASK_ENV=production
      - MAX_UPLOAD_SIZE=10485760  # 10MB in bytes
      - CLEANUP_INTERVAL=3600      # 1 hour in seconds
      - RATE_LIMIT_DISABLED=1  # disable rate limiting for local testing
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - uade-net

  uade-test-runner:
    build:
      context: .
      dockerfile: test/Dockerfile.test
    depends_on:
      uade-web:
        condition: service_healthy
    volumes:
      - test-tmp:/home/tester/app/fixtures
    networks:
      - uade-net

  zap-scan:
    image: ghcr.io/zaproxy/zaproxy:stable
    # DAST scanner service using OWASP ZAP.
    # It scans the uade-web service.
    command: zap-baseline.py -t http://uade-web:5000 -j -a 15 -r report.html
    depends_on:
      uade-web:
        condition: service_healthy
    volumes:
      # ZAP reports will be saved in the 'reports' directory on the host
      - ./reports:/zap/wrk
    networks:
      - uade-net

  zap-full-scan:
    extends:
      service: zap-scan
    command: zap-full-scan.py -t http://uade-web:5000 -j -a 15 -r report.html

  uade-test-race-condition-runner:
    build:
      context: .
      dockerfile: test/Dockerfile.test
    depends_on:
      uade-web:
        condition: service_healthy
    command: ["./test_race_condition.sh"]
    networks:
      - uade-net

volumes:
  uade-tmp:
    driver: local
  test-tmp:
    driver: local

networks:
  uade-net:
    driver: bridge
