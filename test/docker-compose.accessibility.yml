# To run accessibility tests:
#    docker compose -f docker-compose.yml -f test/docker-compose.accessibility.yml up --build uade-test-accessibility-runner
services:
  uade-test-accessibility-runner:
    image: mcr.microsoft.com/playwright:v1.51.1-jammy
    user: pwuser
    depends_on:
      uade-web:
        condition: service_healthy
    networks:
      - uade-net
    volumes:
      - .:/workspace:ro
    working_dir: /workspace
    command: ["bash", "/workspace/test/test_accessibility.sh"]
