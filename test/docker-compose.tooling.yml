# Tool image version manifest for code quality checks.
# Dependabot tracks these `image` tags via the Docker ecosystem in `/test`.
services:
  hadolint:
    image: hadolint/hadolint:v2.14.0
  actionlint:
    image: rhysd/actionlint:1.7.11
  shellcheck:
    image: koalaman/shellcheck:v0.11.0
  k6:
    image: grafana/k6:1.3.0
  playwright:
    # Keep this Playwright image version aligned with
    # test/package.json devDependencies.playwright-core.
    image: mcr.microsoft.com/playwright:v1.62.0-jammy
