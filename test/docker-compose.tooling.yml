# Tool image version manifest for code quality checks.
# Dependabot tracks these `image` tags via the Docker Compose ecosystem in `/test`.
services:
  hadolint:
    image: hadolint/hadolint:v2.15.1
  actionlint:
    image: rhysd/actionlint:1.7.12
  shellcheck:
    image: koalaman/shellcheck:v0.11.0
  k6:
    image: grafana/k6:2.2.0
  playwright:
    # Keep this Playwright image version aligned with
    # test/package.json devDependencies.playwright-core.
    image: mcr.microsoft.com/playwright:v1.63.0-jammy
