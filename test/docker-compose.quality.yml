# Code Quality Validation Service (Docker Compose Override)
#
# Usage (from project root):
#   # Run code quality checks
#   docker compose -f docker-compose.yml -f test/docker-compose.quality.yml up --build quality-check

services:
  quality-check:
    build:
      context: .
      dockerfile: test/Dockerfile.quality
    container_name: uade-quality-check
    volumes:
      # Mount Docker socket for Docker-in-Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount project files for validation (read-only)
      - ./web:/workspace/web
      - ./.github:/workspace/.github:ro
      - ./test:/workspace/test:ro
      - ./pyproject.toml:/workspace/pyproject.toml:ro
      # Mount root-level files for Hadolint and Docker Compose validation
      - ./Dockerfile:/workspace/Dockerfile:ro
      - ./Dockerfile.web:/workspace/Dockerfile.web:ro
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro
      - ./.hadolint.yaml:/workspace/.hadolint.yaml:ro
      - ./.yamllint.yml:/workspace/.yamllint.yml:ro
    working_dir: /workspace
    networks:
      - uade-net

networks:
  uade-net:
    driver: bridge
