# Code Quality Validation Service (Docker Compose Override)
#
# Usage (from project root):
#   # Run code quality checks
#   docker compose -f docker-compose.yml -f test/docker-compose.quality.yml run --rm --build quality-check
#   # Run local CodeQL confirmation
#   docker compose -f docker-compose.yml -f test/docker-compose.quality.yml run --rm --build codeql-check

services:
  quality-check:
    build:
      context: .
      dockerfile: test/Dockerfile.quality
    container_name: uade-quality-check
    volumes:
      # Mount Docker socket for Docker-in-Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount project files for validation (read-only)
      - ./web:/workspace/web
      - ./.github:/workspace/.github:ro
      - ./.agents:/workspace/.agents:ro
      - ./docs:/workspace/docs:ro
      - ./references:/workspace/references:ro
      - ./README.md:/workspace/README.md:ro
      - ./test:/workspace/test:ro
      - ./pyproject.toml:/workspace/pyproject.toml:ro
      - ./.stylelintrc.json:/workspace/.stylelintrc.json:ro
      - ./.htmlhintrc:/workspace/.htmlhintrc:ro
      # Mount root-level files for Hadolint and Docker Compose validation
      - ./Dockerfile:/workspace/Dockerfile:ro
      - ./Dockerfile.web:/workspace/Dockerfile.web:ro
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro
      - ./docker-compose.dev.yml:/workspace/docker-compose.dev.yml:ro
      - ./.hadolint.yaml:/workspace/.hadolint.yaml:ro
      - ./.yamllint.yml:/workspace/.yamllint.yml:ro
    working_dir: /workspace
    networks:
      - uade-net

  codeql-check:
    build:
      context: .
      dockerfile: test/Dockerfile.codeql
    container_name: uade-codeql-check
    volumes:
      - .:/workspace
    working_dir: /workspace
    networks:
      - uade-net

networks:
  uade-net:
    driver: bridge
