# Sample audio while retaining media URLs and parameters in ZAP's scan scope.
replacer.full_list(0).description=Bound audio responses during security scans
replacer.full_list(0).enabled=true
replacer.full_list(0).url=https?://[^/]+/(play|download)/.*
replacer.full_list(0).matchtype=REQ_HEADER
replacer.full_list(0).matchstr=Range
replacer.full_list(0).regex=false
replacer.full_list(0).replacement=bytes=0-65535
