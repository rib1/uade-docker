# To run benchmark tests:
#    docker compose -f docker-compose.yml -f test/docker-compose.benchmark.yml run --rm --build uade-benchmark-runner
services:
  uade-web:
    environment:
      - UADE_TEST_MODE=1
      - RATE_LIMIT_DISABLED=1
      - MAX_CONCURRENT_CONVERSIONS=${MAX_CONCURRENT_CONVERSIONS:-2}

  uade-benchmark-runner:
    build:
      context: .
      dockerfile: test/Dockerfile.benchmark
    user: "0:0"
    depends_on:
      uade-web:
        condition: service_healthy
      test-http-server:
        condition: service_healthy
    networks:
      - uade-net
    volumes:
      - test-tmp:/fixtures:ro
      - ./reports:/reports
    environment:
      - BASE_URL=http://uade-web-player:5000
      - FIXTURES_DIR=/fixtures
      - LOCAL_TEST_SERVER_URL=http://uade-test-http-server:8000
      - REPORT_DIR=/reports/benchmarks

volumes:
  test-tmp:
    driver: local

networks:
  uade-net:
    driver: bridge
