name: Build and Test Web Player

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'Dockerfile.web'
      - '.github/workflows/build-deploy-web-player.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'Dockerfile.web'
      - '.github/workflows/build-deploy-web-player.yml'

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Web Player image
      id: build-and-push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.web
        push: true
        load: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/uade-web-player:test
          ghcr.io/${{ github.repository_owner }}/uade-web-player:latest
          ghcr.io/${{ github.repository_owner }}/uade-web-player:${{ github.sha }}
          ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/uade-web-player:stable', github.repository_owner) || '' }}
        cache-from: |
          type=gha,scope=web
        cache-to: |
          type=gha,mode=max,scope=web
        build-args: |
          BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/uade-cli:latest
          GIT_COMMIT=${{ github.sha }}

    - name: Start Web Player container
      run: |
        docker run -d -p 5000:5000 --name uade-web-test ghcr.io/${{ github.repository_owner }}/uade-web-player:${{ github.sha }}
        sleep 10

    - name: Test health endpoint
      run: |
        curl -f http://localhost:5000/health || exit 1

    - name: Test examples endpoint
      run: |
        curl -f http://localhost:5000/examples || exit 1

    - name: Test FLAC encoder availability
      run: |
        docker exec uade-web-test flac --version

    - name: Check Web Player logs
      if: always()
      run: |
        docker logs uade-web-test

    - name: Stop container
      if: always()
      run: |
        docker stop uade-web-test || true
        docker rm uade-web-test || true

  deploy:
    needs: build-web
    runs-on: ubuntu-latest
    # Only run if the secret is available (i.e., not a fork/Dependabot PR)
    # The job will skip instead of failing if the secret is empty/suppressed.
    if: github.actor != 'dependabot[bot]' && github.repository == 'rib1/uade-docker' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      SERVICE_NAME: uade-web-player
      REGION: us-central1
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Authenticate to Google Cloud
      if: github.actor != 'dependabot[bot]'
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker

    - name: Pull UADE web image from GHCR
      run: docker pull ghcr.io/${{ github.repository_owner }}/uade-web-player:${{ github.sha }}

    - name: Tag and push to Google Container Registry
      run: |
        # GCR (Google Container Registry) only needs the specific image version this branch wants to deploy.
        # The best practice is to copy that specific version (identified by its SHA) into Google's local
        # registry (GCR) to make the final deployment as fast, secure, and reliable as possible.
        # Currently, we are deploying to a single Cloud Run service, so the GCR image is tagged ':latest'.
        docker tag ghcr.io/${{ github.repository_owner }}/uade-web-player:${{ github.sha }} gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest
        docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest

    - name: Deploy to Cloud Run
      # Set to 1 CPU to match single-threaded Python (Gunicorn worker)
      # Use 8 threads to handle a mix of CPU-bound (conversion) and I/O-bound (streaming)
      # Lot of requests will be for cached files (I/O-bound), so this allows for more concurrent streams.
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest \
          --platform managed \
          --region ${{ env.REGION }} \
          --allow-unauthenticated \
          --service-account uade-web-player-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
          --port 5000 \
          --memory 2Gi \
          --cpu 1 \
          --concurrency 8 \
          --timeout 300s \
          --max-instances 10 \
          --min-instances 0 \
          --set-env-vars "FLASK_ENV=production" \
          --set-env-vars "MAX_UPLOAD_SIZE=10485760" \
          --set-env-vars "CLEANUP_INTERVAL=3600" \
          --set-env-vars "CACHE_CLEANUP_INTERVAL=86400" \
          --set-env-vars "RATE_LIMIT=200" \
          --set-env-vars "CACHE_URI=file:///tmp/cache" \
          --set-env-vars "RATE_LIMIT_DISABLED=0"

    - name: Cleanup old untagged images
      continue-on-error: true
      run: |
        # First, prune old Cloud Run revisions so old container digests are no longer pinned.
        # Keep the newest 5 revisions to preserve rollback safety.
        KEEP_REVISIONS=5
        echo "Pruning old Cloud Run revisions (keeping newest ${KEEP_REVISIONS})..."
        REVISIONS=$(gcloud run revisions list \
          --service "${{ env.SERVICE_NAME }}" \
          --region "${{ env.REGION }}" \
          --sort-by="~metadata.creationTimestamp" \
          --format="value(metadata.name)")

        COUNT=0
        echo "$REVISIONS" | while read -r rev; do
          [ -z "$rev" ] && continue
          COUNT=$((COUNT + 1))
          if [ "$COUNT" -le "$KEEP_REVISIONS" ]; then
            echo "Keeping revision: $rev"
            continue
          fi
          echo "Deleting old revision: $rev"
          gcloud run revisions delete "$rev" \
            --region "${{ env.REGION }}" \
            --quiet || echo "  -> Skip: Revision in use or already deleted."
        done

        IMAGE_NAME="gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}"

        # Then prune old commit SHA tags to keep tagged image storage small.
        # Keep latest 20 SHA tags for traceability/rollback.
        KEEP_SHA_TAGS=20
        echo "Pruning old SHA tags (keeping newest ${KEEP_SHA_TAGS})..."
        SHA_TAG_LINES=$(gcloud container images list-tags "$IMAGE_NAME" \
          --filter="tags~'^[0-9a-f]{40}$'" \
          --sort-by="~timestamp" \
          --format="get(tags)" 2>/dev/null || echo "")

        declare -A seen_sha
        SHA_TAGS_ORDERED=()
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          for tag in $(echo "$line" | tr ',' ' '); do
            if [[ "$tag" =~ ^[0-9a-f]{40}$ ]] && [[ -z "${seen_sha[$tag]}" ]]; then
              seen_sha[$tag]=1
              SHA_TAGS_ORDERED+=("$tag")
            fi
          done
        done <<< "$SHA_TAG_LINES"

        idx=0
        for tag in "${SHA_TAGS_ORDERED[@]}"; do
          idx=$((idx + 1))
          if [ "$idx" -le "$KEEP_SHA_TAGS" ]; then
            echo "Keeping SHA tag: $tag"
            continue
          fi
          echo "Removing old SHA tag: $tag"
          gcloud container images untag "${IMAGE_NAME}:${tag}" --quiet || echo "  -> Skip: Could not untag ${tag}."
        done

        # Delete untagged images to save costs.
        # Note: Images pinned by active or inactive Cloud Run revisions will return 400 error and are skipped.
        echo "Fetching untagged images for $IMAGE_NAME..."
        UNTAGGED_DIGESTS=$(gcloud container images list-tags "$IMAGE_NAME" --filter="NOT tags:*" --format="get(digest)" 2>/dev/null || echo "")

        if [ -n "$UNTAGGED_DIGESTS" ]; then
          COUNT=$(echo "$UNTAGGED_DIGESTS" | wc -l)
          echo "Found $COUNT untagged images. Processing..."

          # Loop through digests and attempt deletion.
          # We wrap the command to ensure the loop continues even if gcloud returns an error (like 400 for pinned images).
          echo "$UNTAGGED_DIGESTS" | while read -r digest; do
            [ -z "$digest" ] && continue
            echo "Deleting $digest..."
            gcloud container images delete "$IMAGE_NAME@$digest" --quiet --force-delete-tags || echo "  -> Skip: Image likely pinned by a Cloud Run revision."
          done
          echo "Cleanup process finished."
        else
          echo "No untagged images found."
        fi

    - name: Get Service URL
      id: get-url
      run: |
        URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
          --region ${{ env.REGION }} \
          --format 'value(status.url)')
        echo "url=$URL" >> "$GITHUB_OUTPUT"
        echo "Service deployed at: $URL"

    - name: Test deployment
      run: |
        sleep 10
        curl -f ${{ steps.get-url.outputs.url }}/health || exit 1
        echo "✅ Health check passed!"

    - name: Comment PR with deployment URL
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v8
      with:
        script: |
          const queryParam = 'branch%3Amain';
          const body = `
          🚀 Deployed to Cloud Run: ${{ steps.get-url.outputs.url }}

          ---
          *This is a preview deployment. It will be replaced by subsequent pushes to this PR.*

          🔄 To revert this preview to the stable version, go to the [Actions tab](https://github.com/${{ github.repository }}/actions/workflows/build-deploy-web-player.yml?query=${queryParam}), and click 'Run workflow'.
          `;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          })
