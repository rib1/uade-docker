name: Security SAST

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:${{ matrix.language }}"

  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=auto \
            --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag \
            --sarif \
            --output=semgrep.sarif || true
        env:
          SEMGREP_RULES: >-
            p/security-audit
            p/owasp-top-ten
            p/python
            p/docker
            p/ci
            p/secrets

      - name: Upload Semgrep results to GitHub
        id: upload-semgrep
        uses: github/codeql-action/upload-sarif@v4.37.7
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Dismiss suppressed Semgrep alerts
        uses: advanced-security/dismiss-alerts@v2.0.3
        if: always() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          sarif-id: ${{ steps.upload-semgrep.outputs.sarif-id }}
          sarif-file: semgrep.sarif

  bandit:
    name: Bandit Python Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Install Bandit
        run: pip install bandit[sarif]

      - name: Run Bandit scan
        run: |
          bandit -r web/ -f sarif -o bandit-results.sarif --severity-level medium || true

      - name: Upload Bandit results
        uses: github/codeql-action/upload-sarif@v4.37.7
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  trivy:
    name: Trivy Security Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          trivyignores: '.trivyignore.yaml'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.37.7
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-fs

      - name: Run Trivy scanner on Dockerfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile'
          trivyignores: '.trivyignore.yaml'
          format: 'sarif'
          output: 'trivy-dockerfile.sarif'

      - name: Upload Dockerfile scan results
        uses: github/codeql-action/upload-sarif@v4.37.7
        if: always()
        with:
          sarif_file: 'trivy-dockerfile.sarif'
          category: trivy-dockerfile

  hadolint:
    name: Dockerfile Linting
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - dockerfile: 'Dockerfile'
            label: 'Dockerfile'
          - dockerfile: 'Dockerfile.web'
            label: 'Dockerfile.web'
          - dockerfile: 'test/Dockerfile.quality'
            label: 'Dockerfile.quality'
          - dockerfile: 'test/Dockerfile.test'
            label: 'Dockerfile.test'
          - dockerfile: 'test/Dockerfile.benchmark'
            label: 'Dockerfile.benchmark'
          - dockerfile: 'test/Dockerfile.codeql'
            label: 'Dockerfile.codeql'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve pinned Hadolint image
        id: hadolint-image
        shell: bash
        run: |
          image="$(
            awk '
              /^  hadolint:[[:space:]]*$/ { in_hadolint = 1; next }
              in_hadolint && /^    image:[[:space:]]*/ {
                sub(/^    image:[[:space:]]*/, "")
                print
                exit
              }
            ' test/docker-compose.tooling.yml
          )"
          if [[ ! "$image" =~ ^hadolint/hadolint:v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not resolve a pinned Hadolint image from test/docker-compose.tooling.yml" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Run Hadolint on ${{ matrix.dockerfile }}
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            "${{ steps.hadolint-image.outputs.image }}" \
            hadolint \
            --config .hadolint.yaml \
            --format sarif \
            --no-fail \
            "${{ matrix.dockerfile }}" \
            > "hadolint-${{ matrix.label }}-results.sarif"

      - name: Upload Hadolint results
        uses: github/codeql-action/upload-sarif@v4.37.7
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        with:
          # Avoid the reserved `.quality.sarif` suffix used by GitHub Code Quality.
          sarif_file: hadolint-${{ matrix.label }}-results.sarif
          category: hadolint-${{ matrix.label }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [codeql, semgrep, bandit, trivy, hadolint]
    if: always()

    steps:
      - name: Security Scan Complete
        run: |
          echo "🔒 Security SAST scans completed"
          echo "- CodeQL: ${{ needs.codeql.result }}"
          echo "- Semgrep: ${{ needs.semgrep.result }}"
          echo "- Bandit: ${{ needs.bandit.result }}"
          echo "- Trivy: ${{ needs.trivy.result }}"
          echo "- Hadolint: ${{ needs.hadolint.result }}"
          echo ""
          echo "View results in the Security tab: https://github.com/${{ github.repository }}/security"
