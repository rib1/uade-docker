name: Code Quality Checks

on:
  push:
    branches:
      - main
    paths:
      - 'web/**/*.py'
      - 'web/**/*.js'
      - 'web/**/*.css'
      - '.github/workflows/*.yml'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'test/Dockerfile*'
      - 'test/docker-compose*.yml'
      - 'test/check-code-quality.sh'
      - 'test/Dockerfile.quality'
      - 'test/docker-compose.quality.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web/**/*.py'
      - 'web/**/*.js'
      - 'web/**/*.css'
      - '.github/workflows/*.yml'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'test/Dockerfile*'
      - 'test/docker-compose*.yml'
      - 'test/check-code-quality.sh'
      - 'test/Dockerfile.quality'
      - 'test/docker-compose.quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    name: Run Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run code quality checks
        run: |
          docker compose -f docker-compose.yml -f test/docker-compose.quality.yml up --build quality-check

      - name: Check exit code
        if: failure()
        run: |
          printf "❌ Code quality checks failed!\n"
          printf "Please run './test/check-code-quality.sh --fix' (Bash) or '.\test\check-code-quality.ps1 -Fix' (PowerShell) locally to auto-fix issues.\n"
          exit 1
