name: Code Quality Checks

on:
  push:
    branches:
      - main
    paths:
      - 'web/**/*.py'
      - 'web/**/*.js'
      - 'web/**/*.css'
      - '.github/workflows/*.yml'
      - 'test/check-code-quality.sh'
      - 'test/Dockerfile.quality'
      - 'test/docker-compose.quality.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web/**/*.py'
      - 'web/**/*.js'
      - 'web/**/*.css'
      - '.github/workflows/*.yml'
      - 'test/check-code-quality.sh'
      - 'test/Dockerfile.quality'
      - 'test/docker-compose.quality.yml'
  workflow_dispatch:

jobs:
  code-quality:
    name: Run Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run code quality checks
        run: |
          docker compose -f docker-compose.yml -f test/docker-compose.quality.yml up --build quality-check

      - name: Check exit code
        if: failure()
        run: |
          echo "❌ Code quality checks failed!"
          echo "Please run './test/check-code-quality.sh --fix' locally to auto-fix issues."
          exit 1
